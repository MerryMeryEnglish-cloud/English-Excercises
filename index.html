<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Exercises & Quizzes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a365d;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        /* Sección del Diccionario */
        .dictionary-box {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .dictionary-box h2 {
            font-size: 1.1rem;
            color: #2b6cb0;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .search-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #3182ce;
        }
        .dict-btn {
            padding: 10px 15px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .dict-btn:hover {
            background-color: #2c5282;
        }
        .dict-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #3182ce;
            text-decoration: none;
            font-weight: 600;
        }
        .dict-link:hover {
            text-decoration: underline;
        }
        /* Lista de ejercicios */
        .exercise-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .exercise-item {
            margin-bottom: 12px;
        }
        .exercise-link {
            display: block;
            padding: 14px 20px;
            background-color: #3182ce;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .exercise-link:hover {
            background-color: #2b6cb0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>English Exercises & Quizzes</h1>

        <!-- Buscador Diccionario Cambridge Inglés - Español -->
        <div class="dictionary-box">
            <h2>📖 Diccionario Cambridge (Inglés - Español)</h2>
            <div class="search-group">
                <input type="text" id="wordInput" class="search-input" placeholder="Escribe una palabra en inglés...">
                <button onclick="searchWord()" class="dict-btn">Buscar</button>
            </div>
            <a href="https://dictionary.cambridge.org/es/diccionario/ingles-espanol/" target="_blank" class="dict-link">
                Abrir Cambridge Dictionary ↗
            </a>
        </div>

        <!-- Lista de Ejercicios -->
        <ul class="exercise-list">
            <li class="exercise-item">
                <a class="exercise-link" href="merry_mery_english_reported_speech_quiz.html">Reported Speech Quiz</a>
            </li>
            <li class="exercise-item">
                <a class="exercise-link" href="merry_mery_english_the_little_prince_reading_comprehension.html">The Little Prince Reading</a>
            </li>
            <li class="exercise-item">
                <a class="exercise-link" href="merry_mery_english_verb_mean_masterclass%20(1).html">Verb Mean Masterclass</a>
            </li>
            <li class="exercise-item">
                <a class="exercise-link" href="dynamic_english_phrasal_verbs_master_game%20.html">Phrasal Verbs Master Game</a>
            </li>
        </ul>
    </div>

    <script>
        function searchWord() {
            const word = document.getElementById('wordInput').value.trim();
            if (word) {
                const url = `https://dictionary.cambridge.org/es/diccionario/ingles-espanol/${encodeURIComponent(word.toLowerCase())}`;
                window.open(url, '_blank');
            } else {
                alert('Por favor escribe una palabra para buscar.');
            }
        }

        // Permite presionar Enter para buscar
        document.getElementById('wordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWord();
            }
        });
    </script>
</body>
</html>
